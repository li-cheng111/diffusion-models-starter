# Project 1 baseline: unconditional DDPM on MNIST.
output_dir: runs/exp_mnist_baseline
seed: 42

dataset:
  name: mnist
  batch_size: 128
  image_size: 32
  num_workers: 4
  root: ./data

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_mult: [1, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  image_size: 32

diffusion:
  T: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 1000

ema_decay: 0.9999
mixed_precision: no

training:
  num_epochs: 50
  log_every: 50
  sample_every: 1000
  ckpt_every: 5000
  grad_clip: 1.0

wandb:
  enabled: false
  project: ddpm-course
  run_name: mnist_baseline

