# Project 4 CIFAR-10 Flow Matching 配置
# Small DiT - 适配单卡 RTX 3090/4090 (~24GB)
#
# 结构与 train.py 的读取路径一一对应：data / model / train 三段。

# ─────────── 数据 ───────────
data:
  root: ./data
  num_workers: 4

# ─────────── 模型 ───────────
model:
  type: dit             # 'unet' or 'dit'
  num_classes: 10       # CIFAR-10 真实类别数；null token 固定用 index 10
  # --- type=dit 时生效 ---
  embed_dim: 384        # DiT-S
  depth: 12
  num_heads: 6
  patch_size: 2
  # --- type=unet 时生效 ---
  base_channels: 128

# ─────────── 训练 ───────────
train:
  batch_size: 128
  lr: 2.0e-4
  weight_decay: 0.0
  ema_decay: 0.9999
  grad_clip: 1.0
  max_steps: 200000     # ~100 epochs for CIFAR-10
  cond_drop_prob: 0.1   # CFG 的 conditional dropout 概率
  log_every: 100
  save_every: 10000

# Notes:
# - 教学规模：200K steps ~ 12-24 小时 on RTX 4090
# - 完整论文级训练需要 1M+ steps + larger model
# - Test FID 目标: < 8.0 at NFE=20
# - 先用 configs/cifar10_fm_debug.yaml 跑通全流程，再上这个配置
