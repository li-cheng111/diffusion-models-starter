# Bonus: explicit two-mode target distribution (left vs right target).
n_demos: 1000
n_distractors: 2
chunk_size: 16
demo_path: ./data/demos_multimodal.pkl
seed: 0
target_choices:
  - [-0.65, 0.55]
  - [0.65, 0.55]
use_vision: true
vision_encoder: small
vision_pretrained: false
vision_out_dim: 128
hidden: 256
diffusion_steps: 100
batch_size: 256
lr: 1.0e-3
weight_decay: 0.0
ema_decay: 0.999
max_steps: 10000
log_every: 200
save_every: 2000
ckpt_dir: ./ckpts_multimodal
num_workers: 2
