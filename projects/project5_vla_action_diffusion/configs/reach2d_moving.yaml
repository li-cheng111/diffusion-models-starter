# Bonus: evaluate the static-trained policy with moving distractors.
n_demos: 1000
n_distractors: 2
chunk_size: 16
demo_path: ./data/demos_16.pkl
seed: 0
use_vision: true
vision_encoder: small
vision_pretrained: false
vision_out_dim: 128
hidden: 256
diffusion_steps: 100
batch_size: 256
lr: 1.0e-3
weight_decay: 0.0
ema_decay: 0.999
max_steps: 10000
log_every: 200
save_every: 2000
ckpt_dir: ./ckpts_moving
num_workers: 2
moving_distractors: true
distractor_speed: 0.025
