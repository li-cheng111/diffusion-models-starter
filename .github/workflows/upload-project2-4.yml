name: Upload Project2-4 reproducibility assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-project2-4.yml"
      - "projects/project2_samplers/repro_manifest.*"
      - "projects/project3_stable_diffusion/repro_manifest.*"
      - "projects/project4_flow_matching/repro_manifest.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUTO_URL: https://u1169940-9c48-a0daebe3.bjb1.seetacloud.com:8443
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Download and verify AutoDL assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repro/project2 /tmp/repro/project3 /tmp/repro/project4
          curl --fail --retry 5 --retry-all-errors -L "$AUTO_URL/release/project2/project2-input-ddpm-cifar10-linear-seed44.pt" \
            -o /tmp/repro/project2/project2-input-ddpm-cifar10-linear-seed44.pt
          curl --fail --retry 5 --retry-all-errors -L "$AUTO_URL/release/project3/project3-lora-vangogh-full.safetensors" \
            -o /tmp/repro/project3/project3-lora-vangogh-full.safetensors
          curl --fail --retry 5 --retry-all-errors -L "$AUTO_URL/release/project4/project4-fm-dit-s-step200000.pt" \
            -o /tmp/repro/project4/project4-fm-dit-s-step200000.pt
          cat > /tmp/repro/checksums.sha256 <<'EOF'
          937853559a1377660f7d4cbd1dd3f7c6cf022aed4ab84e9daa918a6e34541412  /tmp/repro/project2/project2-input-ddpm-cifar10-linear-seed44.pt
          82b93c827e18fc4024f3bb03c87163159acc6c1c981db751c572f9f3e0bf9410  /tmp/repro/project3/project3-lora-vangogh-full.safetensors
          7191f6b9209f5e4e016006a76407136616b8ded91957f7fc916ff304442368cf  /tmp/repro/project4/project4-fm-dit-s-step200000.pt
          EOF
          sed -i 's/^          //' /tmp/repro/checksums.sha256
          sha256sum -c /tmp/repro/checksums.sha256
          cp projects/project2_samplers/repro_manifest.json projects/project2_samplers/repro_manifest.sha256 /tmp/repro/project2/
          cp projects/project3_stable_diffusion/repro_manifest.json projects/project3_stable_diffusion/repro_manifest.sha256 /tmp/repro/project3/
          cp projects/project4_flow_matching/repro_manifest.json projects/project4_flow_matching/repro_manifest.sha256 /tmp/repro/project4/
          printf 'release source commit: %s\n' "$GITHUB_SHA" > /tmp/repro/commit.txt

      - name: Create releases and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          }
          create_release project2-v1.0 "Project2 reproducibility v1.0" "Project 2 sampler benchmark input checkpoint. Code is pinned by the release target commit. Verify the asset with repro_manifest.sha256."
          create_release project3-v1.0 "Project3 reproducibility v1.0" "Project 3 Van Gogh LoRA adapter. The base model is stable-diffusion-v1-5/stable-diffusion-v1-5; verify the asset with repro_manifest.sha256."
          create_release project4-v1.0 "Project4 reproducibility v1.0" "Project 4 final DiT-S Flow Matching checkpoint at step 200000. Verify the asset with repro_manifest.sha256."
          gh release upload project2-v1.0 /tmp/repro/project2/project2-input-ddpm-cifar10-linear-seed44.pt /tmp/repro/project2/repro_manifest.json /tmp/repro/project2/repro_manifest.sha256 /tmp/repro/commit.txt --clobber
          gh release upload project3-v1.0 /tmp/repro/project3/project3-lora-vangogh-full.safetensors /tmp/repro/project3/repro_manifest.json /tmp/repro/project3/repro_manifest.sha256 /tmp/repro/commit.txt --clobber
          gh release upload project4-v1.0 /tmp/repro/project4/project4-fm-dit-s-step200000.pt /tmp/repro/project4/repro_manifest.json /tmp/repro/project4/repro_manifest.sha256 /tmp/repro/commit.txt --clobber
